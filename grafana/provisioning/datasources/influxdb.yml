apiVersion: 1

datasources:
  - name: InfluxDB_Flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: iot_org
      defaultBucket: sensor_telemetry
      tlsSkipVerify: true
    secureJsonData:
      token: iot-anomaly-secret-auth-token-987654321
    editable: true

name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r simulator/requirements.txt
          pip install -r ingestor/requirements.txt
          pip install pytest ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest -v

  docker-build:
    name: Docker Images Build & Compose Validation
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          cp .env.example .env
          docker compose config

      - name: Build Simulator Image
        run: |
          docker build -t iot-anomaly-simulator:latest ./simulator

      - name: Build Ingestor Image
        run: |
          docker build -t iot-anomaly-ingestor:latest ./ingestor
